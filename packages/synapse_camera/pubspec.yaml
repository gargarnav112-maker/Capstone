name: synapse_camera
description: "Manually-locked, high-frame-rate camera + torch bridge for the Synapse pupillometer. On-device only."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.synapse.pupillometry.synapse_camera
        pluginClass: SynapseCameraPlugin
      ios:
        pluginClass: SynapseCameraPlugin
